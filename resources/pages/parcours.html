<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2a900">
<title>Le parcours — WASCAL Cape Coast 2026</title>
<meta name="description" content="Le carnet de bord du séjour à UCC : les étapes de l'aventure WASCAL Cape Coast 2026, racontées au fil du temps.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .head{max-width:640px;margin:8px auto 6px;padding:0 16px;text-align:center;}
  .head .over{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--amber);}
  .head h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0 10px;}
  .head p{color:var(--muted);}

  .tl{max-width:720px;margin:34px auto 60px;padding:0 16px;position:relative;}
  .tl::before{content:"";position:absolute;left:23px;top:6px;bottom:6px;width:6px;background:var(--kente);border-radius:6px;border:2px solid var(--ink);}
  .stage{position:relative;padding-left:58px;margin-bottom:26px;}
  .stage .dot{position:absolute;left:8px;top:2px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:900;font-size:.9rem;border:3px solid var(--paper);box-shadow:0 0 0 2.5px var(--ink);}
  .stage .card{padding:16px 18px;}
  .stage .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff;display:inline-block;margin-bottom:8px;}
  .stage .when{font-size:.8rem;font-weight:700;color:var(--muted);float:right;}
  .stage h2{font-size:1.15rem;margin:0 0 6px;}
  .stage p{color:var(--muted);margin:0;white-space:pre-line;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;}
</style>
</head>
<body>
<div class="kente"></div>
<nav class="nav">
  <a class="brand" href="/"><span style="font-size:24px" aria-hidden="true">🧭</span><span><b>Le parcours</b><br><span class="tag">WASCAL Cape Coast 2026</span></span></a>
  <a class="btn btn-ghost" href="/">← Accueil</a>
</nav>

<div class="head">
  <p class="over">Le carnet de bord</p>
  <h1>Étape par étape, notre séjour à UCC</h1>
  <p>Ce qu'on a vécu, dans l'ordre où ça s'est passé — racontée par le Club d'anglais.</p>
</div>

<main class="tl" id="tl">
  <p class="empty">Chargement du parcours…</p>
</main>

<footer class="center">Have fun in English 🌍</footer>

<script type="module">
import { esc } from "/shared.js";

const box = document.getElementById("tl");

fetch("/api/journey-stages").then(r=>r.json()).then(d=>{
  const stages = (d && d.ok && d.stages) || [];
  if(!stages.length){
    box.innerHTML = '<p class="empty">Le parcours n\'a pas encore été rempli — revenez bientôt !</p>';
    return;
  }
  box.innerHTML = stages.map((s,i)=>{
    const tag = s.tagColor ? `<span class="k" style="background:${esc(s.tagColor)}">${esc(s.tagName||"")}</span>` : "";
    const when = s.date_label ? `<span class="when">${esc(s.date_label)}</span>` : "";
    return `<div class="stage">
      <div class="dot">${i+1}</div>
      <div class="card">
        ${tag}${when}
        <h2>${esc(s.title)}</h2>
        ${s.body ? `<p>${esc(s.body)}</p>` : ""}
      </div>
    </div>`;
  }).join("");
}).catch(()=>{
  box.innerHTML = '<p class="empty">Impossible de charger le parcours pour le moment.</p>';
});
</script>
</body>
</html>
