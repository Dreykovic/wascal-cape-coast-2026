<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<title>Affiche · Sorties — WASCAL Cape Coast 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#231a10;--paper:#fffaf0;--muted:#8a7960;--gold:#f2a900;--cream2:#f6e6c4;
  --accent:#0e8c7a;--accent2:#1e3f8f;
  --kente:repeating-linear-gradient(90deg,#f2a900 0 26px,#c5302b 26px 50px,#1c7a45 50px 76px,#1e3f8f 76px 100px,#231a10 100px 112px,#e85d1b 112px 142px);}
@page{size:A4 portrait;margin:0;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:210mm;height:297mm;}
body{font-family:'Hanken Grotesk',sans-serif;color:var(--ink);background:var(--paper);position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 10% 8%,#0e8c7a22,transparent 42%),radial-gradient(circle at 92% 90%,#1e3f8f22,transparent 45%);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.kente{height:13mm;background:var(--kente);}
.deco{position:absolute;opacity:.16;}
.wrap{padding:9mm 14mm 0;height:calc(297mm - 13mm - 18mm);display:flex;flex-direction:column;}
.over{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--accent);color:#fff;font-weight:800;font-size:13pt;padding:7px 16px;border-radius:40px;}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:74pt;line-height:.92;letter-spacing:-.02em;color:var(--accent);}
.heroblock{display:flex;align-items:center;gap:18px;margin-top:6px;}
.heroline{flex:1;height:6px;background:var(--kente);border-radius:4px;}
.heroemoji{font-size:62px;line-height:1;}
.brand{font-size:9.5pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:12px;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto;}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:20px 12px;text-align:center;box-shadow:7px 7px 0 var(--accent);}
.card .emoji{font-size:54px;line-height:1;}
.cname{font-family:'Fraunces',serif;font-weight:900;font-size:21pt;margin-top:8px;}
.ctag{font-size:12.5pt;font-weight:700;color:var(--muted);margin-top:2px;}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;background:var(--ink);border-radius:18px;padding:16px 10px;color:#fff;}
.step{text-align:center;min-width:70px;}
.step .se{font-size:34px;line-height:1;}
.step .sl{font-size:11pt;font-weight:700;margin-top:4px;color:var(--cream2);}
.arrow{font-size:30px;font-weight:800;color:var(--gold);}
.foot{height:18mm;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14mm;position:absolute;bottom:0;left:0;right:0;}
.flags{display:flex;gap:5px;}
.flags svg{border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.fun{font-family:'Fraunces',serif;font-weight:900;font-size:16pt;color:var(--gold);}
</style></head><body>
<div class="kente"></div>
<div class="deco" style="top:18mm;right:16mm;font-size:34px;">🌳</div>
<div class="deco" style="top:118mm;left:6mm;font-size:46px;">✨</div>
<div class="deco" style="top:150mm;right:8mm;font-size:40px;">🏖️</div>
<div class="wrap">
  <div class="over">📍 On explore le Ghana</div>
  <div class="heroblock">
    <h1>SORTIES</h1>
    <div class="heroline"></div>
    <div class="heroemoji">🌳</div>
  </div>
  <div class="brand">WASCAL · Cape Coast 2026 · Have fun in English</div>
  <div class="cards">
    <div class="card"><div class="emoji">🌳</div><div class="cname">Kakum</div><div class="ctag">Canopée · forêt</div></div>
    <div class="card"><div class="emoji">🏰</div><div class="cname">Châteaux</div><div class="ctag">Cape Coast · Elmina</div></div>
    <div class="card"><div class="emoji">🏖️</div><div class="cname">Plage</div><div class="ctag">Week-end soleil</div></div>
  </div>
  <div class="flow">
    <div class="step"><div class="se">🚌</div><div class="sl">On part</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="se">📸</div><div class="sl">On découvre</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="se">🌅</div><div class="sl">On profite</div></div>
  </div>
</div>
<div class="foot">
  <div class="flags">
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="16" height="32" fill="#008751"/><rect x="16" width="32" height="16" fill="#fcd116"/><rect x="16" y="16" width="32" height="16" fill="#e8112d"/></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="48" height="16" fill="#ef2b2d"/><rect y="16" width="48" height="16" fill="#009639"/><g transform="translate(24,16)"><polygon points="0,-6 1.4,-1.9 5.7,-1.9 2.3,0.7 3.5,4.9 0,2.4 -3.5,4.9 -2.3,0.7 -5.7,-1.9 -1.4,-1.9" fill="#fcd116"/></g></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="16" height="32" fill="#f77f00"/><rect x="16" width="16" height="32" fill="#fff"/><rect x="32" width="16" height="32" fill="#009e60"/></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="16" height="32" fill="#ce1126"/><rect x="16" width="16" height="32" fill="#fcd116"/><rect x="32" width="16" height="32" fill="#009460"/></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="16" height="32" fill="#14b53a"/><rect x="16" width="16" height="32" fill="#fcd116"/><rect x="32" width="16" height="32" fill="#ce1126"/></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="48" height="11" fill="#e05206"/><rect y="11" width="48" height="10" fill="#fff"/><rect y="21" width="48" height="11" fill="#0db02b"/><circle cx="24" cy="16" r="4.4" fill="#e05206"/></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="16" height="32" fill="#00853f"/><rect x="16" width="16" height="32" fill="#fdef42"/><rect x="32" width="16" height="32" fill="#e31b23"/><g transform="translate(24,16)"><polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4 0,2 -2.9,4 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" fill="#00853f"/></g></svg>
    <svg viewBox="0 0 48 32" width="40" height="27"><rect width="48" height="32" fill="#ffce00"/><rect width="48" height="6.4" fill="#006a4e"/><rect y="12.8" width="48" height="6.4" fill="#006a4e"/><rect y="25.6" width="48" height="6.4" fill="#006a4e"/><rect width="20" height="19.2" fill="#d21034"/><g transform="translate(10,9.6)"><polygon points="0,-5 1.2,-1.6 4.8,-1.6 1.9,0.6 2.9,4 0,2 -2.9,4 -1.9,0.6 -4.8,-1.6 -1.2,-1.6" fill="#fff"/></g></svg>
  </div>
  <div class="fun">Have fun in English 🌍</div>
</div>
</body></html>
